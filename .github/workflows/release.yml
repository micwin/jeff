name: Release Jeff

on:
  push:
    branches:
      - 'release/v*'

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/jeff/go.mod

      - name: Build binary and deb
        run: |
          SKIP_VERSION_BUMP=1 ./scripts/build.sh --compile --deb

      - name: Read release version
        id: version
        run: |
          REF_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${REF_NAME#release/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jeff v${{ steps.version.outputs.version }}
          body_path: doc/ghpages/releases/v${{ steps.version.outputs.version }}.md
          files: |
            dist/jeff
            dist/jeff_${{ steps.version.outputs.version }}_amd64.deb

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Build GitHub Pages site
        run: ./scripts/build-docs.sh

      - name: Publish gh-pages branch
        env:
          GIT_AUTHOR_NAME: Jeff Release Bot
          GIT_AUTHOR_EMAIL: release-bot@example.com
          GIT_COMMITTER_NAME: Jeff Release Bot
          GIT_COMMITTER_EMAIL: release-bot@example.com
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE_STAGING=$(mktemp -d)
          PUBLISH_DIR=$(mktemp -d)
          cp -R work/ghpages-site/. "$SITE_STAGING"/
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"
          cd "$PUBLISH_DIR"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$SITE_STAGING"/. .
          touch .nojekyll
          git add --all
          git commit -m "Publish site for v${{ steps.version.outputs.version }}" || exit 0
          git push origin HEAD:gh-pages
