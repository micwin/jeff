name: Release Jeff

on:
  push:
    branches:
      - 'release/v*'

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/jeff/go.mod

      - name: Build binary and deb
        run: |
          SKIP_VERSION_BUMP=1 ./scripts/build.sh --compile --deb

      - name: Read release version
        id: version
        run: |
          REF_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${REF_NAME#release/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Jeff v${{ steps.version.outputs.version }}
          body_path: doc/ghpages/releases/v${{ steps.version.outputs.version }}.md
          files: |
            dist/jeff
            dist/jeff_${{ steps.version.outputs.version }}_amd64.deb

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Build GitHub Pages site
        run: ./scripts/build-docs.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: work/ghpages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
