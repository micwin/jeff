name: Release Jeff

on:
  push:
    branches:
      - 'release/v*'

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/jeff/go.mod

      - name: Build binary and deb
        run: |
          SKIP_VERSION_BUMP=1 ./scripts/build.sh --compile --deb

      - name: Read release version
        id: version
        run: |
          REF_NAME=${GITHUB_REF#refs/heads/}
          VERSION=${REF_NAME#release/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Jeff v${{ steps.version.outputs.version }}
          body_path: doc/ghpages/releases/v${{ steps.version.outputs.version }}.md
          files: |
            dist/jeff
            dist/jeff_${{ steps.version.outputs.version }}_amd64.deb

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
          working-directory: doc/ghpages

      - name: Build GitHub Pages site
        run: ./scripts/build-docs.sh

      - name: Prepare gh-pages branch
        env:
          GIT_AUTHOR_NAME: Jeff Release Bot
          GIT_AUTHOR_EMAIL: release-bot@example.com
          GIT_COMMITTER_NAME: Jeff Release Bot
          GIT_COMMITTER_EMAIL: release-bot@example.com
        run: |
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R work/ghpages-site/. .
          git add --all
          git commit -m "Publish site for v${{ steps.version.outputs.version }}"

      - name: Push gh-pages
        run: git push origin gh-pages
